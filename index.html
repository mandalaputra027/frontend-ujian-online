<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ujian Online</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f0f2f5; }
   .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:disabled { background: #ccc; }
    #examContainer, #blockedContainer, #warningBox { display: none; }
    #warningBox { position: fixed; top: 20px; right: 20px; background: #ea4335; color: white; padding: 15px; border-radius: 8px; }
    iframe { width: 100%; height: 80vh; border: none; }
  </style>
</head>
<body>
<div class="container" id="loginContainer">
  <h2>Ujian Online</h2>
  <form id="loginForm">
    <input type="text" id="studentName" placeholder="Nama Lengkap" required>
    <input type="email" id="studentEmail" placeholder="Email" required>
    <select id="subject" required>
      <option value="">Loading mapel...</option>
    </select>
    <button type="submit" id="startBtn">Mulai Ujian</button>
  </form>
</div>

<div id="examContainer">
  <div id="warningBox">⚠️ Jangan pindah tab! Pelanggaran: <span id="warningCount">0</span>/5</div>
  <iframe id="formFrame"></iframe>
</div>

<div class="container" id="blockedContainer">
  <h2 style="color: red;">🚫 AKSES DIBLOKIR</h2>
  <p>Anda diblokir karena terlalu banyak pindah tab.</p>
</div>

<script>
const CONFIG = {
  BACKEND_URL: 'https://backend-ujian-online.onrender.com',
  MAX_WARNINGS: 5
};

let studentData = {};
let warningCount = 0;
let statusCheckInterval;

// FIX 1: Load mapel saat halaman dibuka
window.addEventListener('DOMContentLoaded', loadSubjects);

async function loadSubjects() {
  try {
    const res = await fetch(`${CONFIG.BACKEND_URL}/api/subjects`);
    const subjects = await res.json();

    const select = document.getElementById('subject');
    select.innerHTML = '<option value="">-- Pilih Mapel --</option>';

    if (Object.keys(subjects).length === 0) {
      select.innerHTML = '<option value="">Admin belum set mapel</option>';
      return;
    }

    for (let id in subjects) {
      select.innerHTML += `<option value="${id}">${subjects[id].name}</option>`;
    }
  } catch (e) {
    document.getElementById('subject').innerHTML = '<option value="">Gagal load mapel</option>';
    console.error(e);
  }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const name = document.getElementById('studentName').value.trim();
  const email = document.getElementById('studentEmail').value.trim();
  const subject = document.getElementById('subject').value;

  if (!subject) return alert('Pilih mapel dulu!');

  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'Memulai...';

  try {
    const response = await fetch(`${CONFIG.BACKEND_URL}/api/init`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, subject })
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    if (result.blocked) return showBlocked();

    studentData = { name, email, subject };
    warningCount = result.switchCount;
    startExam(result.formUrl);

  } catch (error) {
    alert(error.message || 'Gagal terhubung ke server');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = 'Mulai Ujian';
  }
});

function startExam(formUrl) {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('examContainer').style.display = 'block';
  document.getElementById('formFrame').src = formUrl;
  document.getElementById('warningCount').textContent = warningCount;

  document.documentElement.requestFullscreen?.();
  document.addEventListener('visibilitychange', handleTabSwitch);
  window.addEventListener('blur', handleTabSwitch);
  document.addEventListener('contextmenu', e => e.preventDefault());
  startStatusCheck();
}

function handleTabSwitch() {
  if (document.hidden) {
    warningCount++;
    document.getElementById('warningCount').textContent = warningCount;
    document.getElementById('warningBox').style.display = 'block';
    logViolation('Tab switch');
    if (warningCount >= CONFIG.MAX_WARNINGS) exitExam();
  }
}

async function logViolation(event) {
  await fetch(`${CONFIG.BACKEND_URL}/api/log`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: studentData.email, event, switchCount: warningCount })
  });
}

function startStatusCheck() {
  statusCheckInterval = setInterval(async () => {
    const res = await fetch(`${CONFIG.BACKEND_URL}/api/status?email=${studentData.email}`);
    const data = await res.json();
    if (data.blocked) exitExam();
  }, 5000);
}

function exitExam() {
  clearInterval(statusCheckInterval);
  document.exitFullscreen?.();
  document.getElementById('examContainer').style.display = 'none';
  showBlocked();
}

function showBlocked() {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('blockedContainer').style.display = 'block';
}
</script>
</body>
</html>
