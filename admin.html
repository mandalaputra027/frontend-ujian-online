<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — SMP Kanisius Kudus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --surface2:  #1e2336;
      --surface3:  #232840;
      --border:    rgba(255,255,255,0.08);
      --border2:   rgba(255,255,255,0.14);
      --accent:    #4f7eff;
      --accent2:   #7b9fff;
      --danger:    #ff4f4f;
      --warn:      #f5a623;
      --success:   #3ecf8e;
      --text:      #e8eaf2;
      --muted:     #7c8299;
      --radius:    10px;
      --radius-lg: 16px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0; opacity: 0.12;
      animation: pulse 8s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -200px; left: -150px; }
    .orb-2 { width: 400px; height: 400px; background: #9b59f7; bottom: -100px; right: -100px; animation-delay: 4s; }
    @keyframes pulse { 0%,100%{opacity:.12} 50%{opacity:.2} }

    /* ─── TOPBAR ─── */
    .topbar {
      position: sticky; top: 0;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex; align-items: center; gap: 14px;
      padding: 0 28px;
      height: 54px;
    }
    .topbar-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 18px; color: var(--text);
    }
    .topbar-sep { height: 20px; width: 1px; background: var(--border2); }
    .topbar-sub { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }
    .topbar-right { margin-left: auto; }
    .admin-badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 99px;
      background: rgba(79,126,255,0.12);
      border: 1px solid rgba(79,126,255,0.3);
      color: var(--accent2);
      font-family: 'DM Mono', monospace;
    }

    /* ─── LAYOUT ─── */
    .main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ─── LOGIN ─── */
    #loginPage {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 24px;
    }
    #loginPage.hidden { display: none; }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
      animation: fadeUp 0.45s ease both;
    }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .login-logo {
      width: 40px; height: 40px; border-radius: 8px;
      background: white; object-fit: contain; padding: 3px; flex-shrink: 0;
    }
    .login-logo-fb {
      width: 40px; height: 40px; border-radius: 8px;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif; font-size: 18px; color: white; flex-shrink: 0;
    }
    .login-brand h1 { font-family: 'DM Serif Display', serif; font-size: 17px; font-weight: 400; }
    .login-brand p  { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 1px; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    /* ─── SECTION TITLES ─── */
    .section-title {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 18px; font-weight: 400;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title h2 .icon { font-size: 16px; }

    /* ─── CARD ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    /* ─── FORM ELEMENTS ─── */
    .form-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
      align-items: flex-end;
    }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.7px;
    }
    input[type=text], input[type=password], input[type=number], input[type=email] {
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,126,255,0.15);
    }
    input[type=number] { width: 100px; }
    .input-url { width: 320px; max-width: 100%; }
    .input-sm  { width: 130px; }
    .input-md  { width: 180px; }

    /* ─── BUTTONS ─── */
    .btn {
      padding: 10px 18px;
      border: none; border-radius: var(--radius);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent); color: white;
      box-shadow: 0 4px 16px rgba(79,126,255,0.3);
    }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); }

    .btn-danger {
      background: rgba(255,79,79,0.12); color: var(--danger);
      border: 1px solid rgba(255,79,79,0.25);
    }
    .btn-danger:hover { background: rgba(255,79,79,0.2); }

    .btn-warn {
      background: rgba(245,166,35,0.12); color: var(--warn);
      border: 1px solid rgba(245,166,35,0.25);
    }
    .btn-warn:hover { background: rgba(245,166,35,0.2); }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── ALERTS ─── */
    .alert {
      padding: 11px 14px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 14px;
      display: none; align-items: flex-start; gap: 8px;
    }
    .alert.show { display: flex; }
    .alert-danger { background: rgba(255,79,79,0.1); border: 1px solid rgba(255,79,79,0.25); color: #ff8080; }
    .alert-success { background: rgba(62,207,142,0.1); border: 1px solid rgba(62,207,142,0.25); color: var(--success); }

    /* ─── TABLES ─── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface2); }
    th {
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 600;
      color: var(--muted); letter-spacing: 0.7px; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 14px;
      font-size: 13px; color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      font-family: 'DM Mono', monospace;
    }
    .badge-success { background: rgba(62,207,142,0.1); color: var(--success); border: 1px solid rgba(62,207,142,0.25); }
    .badge-danger  { background: rgba(255,79,79,0.1);  color: var(--danger);  border: 1px solid rgba(255,79,79,0.25); }
    .badge-warn    { background: rgba(245,166,35,0.1); color: var(--warn);    border: 1px solid rgba(245,166,35,0.25); }
    .badge-muted   { background: var(--surface3); color: var(--muted); border: 1px solid var(--border); }

    .mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
    .url-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
    .log-detail { font-size: 11px; color: var(--muted); line-height: 1.8; }
    .td-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .empty-state { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* ─── TOAST ─── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 999;
      transform: translateY(80px); opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: rgba(62,207,142,0.3); color: var(--success); }
    #toast.error   { border-color: rgba(255,79,79,0.3);  color: #ff8080; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ════ LOGIN ════ -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-brand">
      <img src="https://www.smpkanisiuskudus.sch.id/admin/img/logo-kanisius.png"
        class="login-logo" alt="Logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="login-logo-fb" style="display:none">K</div>
      <div>
        <h1>SMP Kanisius Kudus</h1>
        <p>ADMIN PANEL</p>
      </div>
    </div>

    <div class="alert alert-danger" id="loginAlert">
      <span>⚠</span><span id="loginAlertMsg"></span>
    </div>

    <div class="form-field" style="margin-bottom:14px">
      <label>Password Admin</label>
      <input type="password" id="adminPass" placeholder="Masukkan password"
        onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()" style="width:100%">
      Masuk
    </button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="appShell" class="hidden">

  <div class="topbar">
    <div class="topbar-brand">Kanisius</div>
    <div class="topbar-sep"></div>
    <div class="topbar-sub">ADMIN PANEL</div>
    <div class="topbar-right">
      <span class="admin-badge">Administrator</span>
    </div>
  </div>

  <div class="main">

    <!-- ── MAPEL ── -->
    <div class="card">
      <div class="section-title">
        <h2><span class="icon">📚</span> Kelola Mapel & Link Form</h2>
      </div>

      <div class="alert alert-danger" id="subjectAlert"><span>⚠</span><span id="subjectAlertMsg"></span></div>

      <div class="form-row">
        <div class="form-field">
          <label>ID Mapel</label>
          <input type="text" id="subjectId" placeholder="Contoh: mtk" class="input-sm">
        </div>
        <div class="form-field">
          <label>Nama Mapel</label>
          <input type="text" id="subjectName" placeholder="Contoh: Matematika" class="input-md">
        </div>
        <div class="form-field">
          <label>Link Google Form</label>
          <input type="text" id="formUrl" placeholder="https://docs.google.com/forms/…" class="input-url">
        </div>
        <button class="btn btn-primary" id="saveSubjectBtn" onclick="saveSubject()">Simpan Mapel</button>
        <button class="btn btn-ghost" onclick="clearSubjectForm()">Batal</button>
      </div>

      <div id="subjectTable"><div class="empty-state">Memuat data…</div></div>
    </div>

    <!-- ── PELANGGARAN ── -->
    <div class="card">
      <div class="section-title">
        <h2><span class="icon">⚠️</span> Kelola Jenis Pelanggaran</h2>
      </div>

      <div class="alert alert-danger" id="violationAlert"><span>⚠</span><span id="violationAlertMsg"></span></div>

      <div class="form-row">
        <div class="form-field">
          <label>ID Pelanggaran</label>
          <input type="text" id="violationId" placeholder="Contoh: TAB_SWITCH" class="input-md">
        </div>
        <div class="form-field">
          <label>Nama</label>
          <input type="text" id="violationName" placeholder="Contoh: Pindah Tab" class="input-md">
        </div>
        <div class="form-field">
          <label>Poin</label>
          <input type="number" id="violationPoint" placeholder="1" min="0">
        </div>
        <div class="form-field">
          <label>Auto-blokir (total poin)</label>
          <input type="number" id="violationAutoBlock" placeholder="10" min="0" style="width:130px">
        </div>
        <button class="btn btn-primary" id="saveViolationBtn" onclick="saveViolation()">Simpan</button>
        <button class="btn btn-ghost" onclick="clearViolationForm()">Batal</button>
      </div>

      <div id="violationTable"><div class="empty-state">Memuat data…</div></div>
    </div>

    <!-- ── MONITORING ── -->
    <div class="card">
      <div class="section-title">
        <h2><span class="icon">👨‍🎓</span> Monitoring Siswa</h2>
        <button class="btn btn-ghost btn-sm" id="refreshBtn" onclick="loadStudents()">
          <span id="refreshIcon">↻</span> Refresh
        </button>
      </div>
      <div id="studentTable"><div class="empty-state">Memuat data…</div></div>
    </div>

  </div><!-- /main -->
</div><!-- /appShell -->

<!-- Toast -->
<div id="toast"></div>

<script>
"use strict";

const API_URL = 'https://backend-ujian-online.onrender.com';
let adminPass = '';
let toastTimer = null;

/* ─────────── LOGIN ─────────── */
async function handleLogin() {
  const pass = document.getElementById('adminPass').value.trim();
  if (!pass) return showLoginAlert('Password tidak boleh kosong.');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Masuk…';
  hideLoginAlert();

  try {
    // Verifikasi dengan memuat data pertama kali
    adminPass = pass;
    await api('/admin/subjects'); // kalau 401, akan throw

    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
    loadAll();
  } catch (e) {
    adminPass = '';
    if (e.status === 401) showLoginAlert('Password salah. Coba lagi.');
    else showLoginAlert('Tidak dapat terhubung ke server.');
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

/* ─────────── API ─────────── */
async function api(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': adminPass,
    },
  };
  if (body) opts.body = JSON.stringify(body);

  const res = await fetch(API_URL + path, opts);

  if (res.status === 401) {
    const err = new Error('Unauthorized');
    err.status = 401;
    throw err;
  }
  if (!res.ok) {
    const err = new Error('Server error');
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function loadAll() {
  loadSubjects();
  loadViolations();
  loadStudents();
}

/* ─────────── MAPEL ─────────── */
async function loadSubjects() {
  const el = document.getElementById('subjectTable');
  try {
    const data = await api('/admin/subjects');
    const keys = Object.keys(data);
    if (!keys.length) {
      el.innerHTML = '<div class="empty-state">Belum ada mapel tersimpan.</div>';
      return;
    }
    let rows = '';
    keys.forEach(id => {
      const s = data[id];
      const hasUrl = s.formUrl && s.formUrl.trim();
      rows += `<tr>
        <td><span class="mono">${escHtml(id)}</span></td>
        <td>${escHtml(s.name)}</td>
        <td><span class="url-cell" title="${escHtml(s.formUrl || '')}">${hasUrl ? escHtml(s.formUrl) : '<i style="color:var(--muted)">Belum diisi</i>'}</span></td>
        <td><span class="badge ${hasUrl ? 'badge-success' : 'badge-warn'}">${hasUrl ? '✓ Siap' : '⚠ Belum ada form'}</span></td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ghost btn-sm" onclick="editSubject('${escAttr(id)}','${escAttr(s.name)}','${escAttr(s.formUrl||'')}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSubject('${escAttr(id)}')">Hapus</button>
          </div>
        </td>
      </tr>`;
    });
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama Mapel</th><th>Link Form</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Gagal memuat data mapel.</div>`;
  }
}

function editSubject(id, name, formUrl) {
  document.getElementById('subjectId').value = id;
  document.getElementById('subjectName').value = name;
  document.getElementById('formUrl').value = formUrl;
  document.getElementById('subjectId').scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('subjectId').focus();
}

function clearSubjectForm() {
  ['subjectId','subjectName','formUrl'].forEach(id => document.getElementById(id).value = '');
}

async function saveSubject() {
  const id      = document.getElementById('subjectId').value.trim();
  const name    = document.getElementById('subjectName').value.trim();
  const formUrl = document.getElementById('formUrl').value.trim();

  if (!id)   return showAlert('subjectAlert', 'subjectAlertMsg', 'ID mapel wajib diisi.');
  if (!name) return showAlert('subjectAlert', 'subjectAlertMsg', 'Nama mapel wajib diisi.');

  const btn = document.getElementById('saveSubjectBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  hideAlert('subjectAlert');

  try {
    await api('/admin/subjects', 'POST', { id, name, formUrl });
    showToast('Mapel berhasil disimpan.', 'success');
    clearSubjectForm();
    loadSubjects();
  } catch {
    showAlert('subjectAlert', 'subjectAlertMsg', 'Gagal menyimpan mapel.');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan Mapel';
  }
}

async function deleteSubject(id) {
  if (!confirm(`Hapus mapel "${id}"? Aksi ini tidak dapat dibatalkan.`)) return;
  try {
    await api(`/admin/subject/${encodeURIComponent(id)}`, 'DELETE');
    showToast('Mapel dihapus.', 'success');
    loadSubjects();
  } catch {
    showToast('Gagal menghapus mapel.', 'error');
  }
}

/* ─────────── PELANGGARAN ─────────── */
async function loadViolations() {
  const el = document.getElementById('violationTable');
  try {
    const data = await api('/admin/violations');
    const keys = Object.keys(data);
    if (!keys.length) {
      el.innerHTML = '<div class="empty-state">Belum ada jenis pelanggaran.</div>';
      return;
    }
    let rows = '';
    keys.forEach(id => {
      const v = data[id];
      rows += `<tr>
        <td><span class="mono">${escHtml(id)}</span></td>
        <td>${escHtml(v.name)}</td>
        <td><span class="badge badge-warn">+${v.point} poin</span></td>
        <td><span class="mono">${v.autoBlock} poin total</span></td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ghost btn-sm" onclick="editViolation('${escAttr(id)}','${escAttr(v.name)}',${v.point},${v.autoBlock})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteViolation('${escAttr(id)}')">Hapus</button>
          </div>
        </td>
      </tr>`;
    });
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama</th><th>Poin</th><th>Auto-blokir</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Gagal memuat data pelanggaran.</div>`;
  }
}

function editViolation(id, name, point, autoBlock) {
  document.getElementById('violationId').value = id;
  document.getElementById('violationName').value = name;
  document.getElementById('violationPoint').value = point;
  document.getElementById('violationAutoBlock').value = autoBlock;
  document.getElementById('violationId').scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('violationId').focus();
}

function clearViolationForm() {
  ['violationId','violationName','violationPoint','violationAutoBlock'].forEach(id => document.getElementById(id).value = '');
}

async function saveViolation() {
  const id        = document.getElementById('violationId').value.trim();
  const name      = document.getElementById('violationName').value.trim();
  const point     = parseInt(document.getElementById('violationPoint').value) || 0;
  const autoBlock = parseInt(document.getElementById('violationAutoBlock').value) || 0;

  if (!id)   return showAlert('violationAlert', 'violationAlertMsg', 'ID pelanggaran wajib diisi.');
  if (!name) return showAlert('violationAlert', 'violationAlertMsg', 'Nama pelanggaran wajib diisi.');

  const btn = document.getElementById('saveViolationBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  hideAlert('violationAlert');

  try {
    await api('/admin/violations', 'POST', { id, name, point, autoBlock });
    showToast('Pelanggaran berhasil disimpan.', 'success');
    clearViolationForm();
    loadViolations();
  } catch {
    showAlert('violationAlert', 'violationAlertMsg', 'Gagal menyimpan pelanggaran.');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

async function deleteViolation(id) {
  if (!confirm(`Hapus jenis pelanggaran "${id}"?`)) return;
  try {
    await api(`/admin/violation/${encodeURIComponent(id)}`, 'DELETE');
    showToast('Pelanggaran dihapus.', 'success');
    loadViolations();
  } catch {
    showToast('Gagal menghapus pelanggaran.', 'error');
  }
}

/* ─────────── MONITORING ─────────── */
async function loadStudents() {
  const el  = document.getElementById('studentTable');
  const ico = document.getElementById('refreshIcon');
  ico.style.animation = 'spin 0.7s linear infinite';

  try {
    const data = await api('/admin/students');
    if (!data.length) {
      el.innerHTML = '<div class="empty-state">Belum ada siswa yang login.</div>';
      return;
    }

    let rows = '';
    data.forEach(s => {
      const logHtml = s.logs?.length
        ? s.logs.map(l => `<span>${escHtml(l.violationName)} <b style="color:var(--warn)">+${l.point}</b></span>`).join('<br>')
        : '<span style="color:var(--muted)">—</span>';

      const statusBadge = s.blocked
        ? '<span class="badge badge-danger">🚫 Diblokir</span>'
        : '<span class="badge badge-success">✓ Aktif</span>';

      const pointBadge = s.totalPoint > 0
        ? `<span class="badge ${s.totalPoint >= 10 ? 'badge-danger' : 'badge-warn'}">${s.totalPoint} poin</span>`
        : `<span class="badge badge-muted">0 poin</span>`;

      rows += `<tr>
        <td>${escHtml(s.name)}</td>
        <td><span class="mono">${escHtml(s.email)}</span></td>
        <td>${escHtml(s.subject)}</td>
        <td>${pointBadge}</td>
        <td><div class="log-detail">${logHtml}</div></td>
        <td>${statusBadge}</td>
        <td>
          <div class="td-actions">
            ${!s.blocked ? `<button class="btn btn-warn btn-sm" onclick="blockStudent('${escAttr(s.email)}')">Blokir</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteStudent('${escAttr(s.email)}')">Hapus</button>
          </div>
        </td>
      </tr>`;
    });

    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Email</th><th>Mapel</th><th>Total Poin</th><th>Riwayat Pelanggaran</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch {
    el.innerHTML = `<div class="empty-state" style="color:var(--danger)">Gagal memuat data siswa.</div>`;
  } finally {
    ico.style.animation = '';
  }
}

async function blockStudent(email) {
  if (!confirm(`Blokir siswa ${email}?`)) return;
  try {
    await api(`/admin/student/${encodeURIComponent(email)}/block`, 'POST');
    showToast('Siswa berhasil diblokir.', 'success');
    loadStudents();
  } catch {
    showToast('Gagal memblokir siswa.', 'error');
  }
}

async function deleteStudent(email) {
  if (!confirm(`Hapus semua data siswa ${email}?`)) return;
  try {
    await api(`/admin/student/${encodeURIComponent(email)}`, 'DELETE');
    showToast('Data siswa dihapus.', 'success');
    loadStudents();
  } catch {
    showToast('Gagal menghapus data siswa.', 'error');
  }
}

/* ─────────── UI HELPERS ─────────── */
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function showAlert(wrapperId, msgId, msg) {
  document.getElementById(msgId).textContent = msg;
  document.getElementById(wrapperId).classList.add('show');
}
function hideAlert(wrapperId) {
  document.getElementById(wrapperId).classList.remove('show');
}
function showLoginAlert(msg) {
  document.getElementById('loginAlertMsg').textContent = msg;
  document.getElementById('loginAlert').classList.add('show');
}
function hideLoginAlert() {
  document.getElementById('loginAlert').classList.remove('show');
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  if (!str) return '';
  return String(str).replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
</script>
